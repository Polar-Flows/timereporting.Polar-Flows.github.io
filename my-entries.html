<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title>My Entries - Time Reporting</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <style>
    .back-link { font-size: 0.9rem; margin-bottom: 1.5rem; display: block; }

    /* Month picker row */
    .controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .controls label { font-size: 0.85rem; font-weight: 600; margin: 0; }
    .controls input[type="month"] { width: auto; margin: 0; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; font-size: 0.9rem; white-space: nowrap; }
    td { vertical-align: middle; }
    .col-date    { min-width: 110px; }
    .col-project { white-space: normal; min-width: 180px; }
    .col-notes   { white-space: normal; min-width: 200px; }
    .col-hours   { text-align: right; }
    th.col-hours { text-align: right; }
    .muted { color: var(--pico-muted-color); }
    .billable-yes { color: #2e7d32; font-weight: 600; }
    .billable-no  { color: var(--pico-muted-color); }
    .actions { display: flex; gap: 0.4rem; }
    .actions button { font-size: 0.8rem; padding: 0.25rem 0.7rem; margin: 0; width: auto; }
    tfoot td { font-weight: 600; border-top: 2px solid var(--pico-table-border-color, #ddd); }

    /* Status */
    #status { min-height: 1.2rem; font-size: 0.85rem; }
    .error   { color: var(--pico-del-color, #c62828); }
    .success { color: #2e7d32; }

    /* Edit modal */
    dialog { max-width: 520px; width: 100%; border-radius: var(--pico-border-radius); padding: 2rem; flex-direction: column; }
    dialog h2 { margin-top: 0; margin-bottom: 1.5rem; font-size: 1.2rem; }
    dialog .field { margin-top: 0; margin-bottom: 1.2rem; }
    dialog label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 0; margin-bottom: 0.3rem; }
    dialog input, dialog select, dialog textarea { width: 100%; margin-top: 0; margin-bottom: 0; }
    dialog textarea { resize: vertical; }
    dialog .hint { font-size: 0.78rem; color: var(--pico-muted-color); margin-top: 0.25rem; margin-bottom: 0; }
    dialog .modal-footer { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.5rem; }
    dialog .modal-footer button { width: auto; margin: 0; }
    dialog #modal-error { color: var(--pico-del-color, #c62828); font-size: 0.85rem; min-height: 1.2rem; margin: 0; }

    @media (max-width: 480px) {
      dialog { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <a href="index.html" class="back-link">&larr; Back</a>
    <hgroup>
      <h1>My Entries</h1>
      <p id="user-label"></p>
    </hgroup>

    <div id="view-loading"><p aria-busy="true">Loading...</p></div>

    <div id="view-main" hidden>
      <div class="controls">
        <label for="f-month">Month</label>
        <input id="f-month" type="month">
      </div>
      <p id="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-date">Date</th>
              <th class="col-project">Project</th>
              <th>Billable</th>
              <th class="col-hours">Hours</th>
              <th>Task ID</th>
              <th class="col-notes">Description</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="entries-tbody"></tbody>
          <tfoot id="entries-tfoot"></tfoot>
        </table>
      </div>
    </div>
  </main>

  <!-- Edit modal -->
  <dialog id="edit-modal">
    <h2>Edit entry</h2>

    <div class="field">
      <label for="e-date">Date</label>
      <input id="e-date" type="date" required>
    </div>

    <div class="field">
      <label for="e-project">Project</label>
      <select id="e-project" required></select>
    </div>

    <div class="field">
      <label for="e-hours">Hours</label>
      <input id="e-hours" type="number" step="0.5" min="0.5" max="24" required>
    </div>

    <div class="field" id="e-task-wrap" hidden>
      <label for="e-task">Task ID</label>
      <!-- replaced dynamically -->
      <input id="e-task" type="text" placeholder="Enter task ID">
    </div>

    <div class="field">
      <label for="e-desc">
        Description
        <small style="font-weight:normal; color:var(--pico-muted-color)"> — optional</small>
      </label>
      <textarea id="e-desc" rows="3"></textarea>
    </div>

    <p id="modal-error"></p>

    <div class="modal-footer">
      <button id="modal-cancel" class="secondary outline">Cancel</button>
      <button id="modal-save">Save changes</button>
    </div>
  </dialog>

  <script type="module">
    import { handleRedirectAndGetAccount, getCurrentUser } from './auth.js';
    import { adminRead, dataRead, dataWrite } from './storage.js';

    (async () => {

    const viewLoading = document.getElementById('view-loading');
    const viewMain    = document.getElementById('view-main');
    const tbody       = document.getElementById('entries-tbody');
    const tfoot       = document.getElementById('entries-tfoot');
    const status      = document.getElementById('status');
    const modal       = document.getElementById('edit-modal');
    const modalError  = document.getElementById('modal-error');

    // Auth
    const account = await handleRedirectAndGetAccount();
    if (!account) { window.location.href = 'index.html'; return; }
    const user = await getCurrentUser();
    document.getElementById('user-label').textContent = user.name;

    // Load projects (for name lookup and task field rendering)
    const allProjects = await adminRead('projects.json') || [];
    const projectMap  = Object.fromEntries(allProjects.map(p => [p.id, p]));
    const myProjects  = allProjects.filter(p =>
      (p.allowedConsultants || []).map(e => e.toLowerCase()).includes(user.email.toLowerCase())
    );

    viewLoading.hidden = true;
    viewMain.hidden = false;

    // Month picker — default to current month
    const monthPicker = document.getElementById('f-month');
    monthPicker.value = currentMonthISO();
    monthPicker.addEventListener('change', () => loadEntries());

    // State
    let file    = null; // the loaded JSON file for the selected month
    let editId  = null; // ID of the entry being edited

    await loadEntries();

    // ---- Load ----
    async function loadEntries() {
      const period   = monthPicker.value;
      const blobPath = `entries/${user.email}/${period}.json`;
      setStatus('Loading...', '');
      tbody.innerHTML = '';
      tfoot.innerHTML = '';
      try {
        file = await dataRead(blobPath);
        if (!file || !file.entries || !file.entries.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="muted">No entries for this month.</td></tr>';
          setStatus('', '');
          return;
        }
        const sorted = [...file.entries].sort((a, b) => a.date.localeCompare(b.date));
        renderRows(sorted);
        renderTotals(sorted);
        setStatus('', '');
      } catch (err) {
        setStatus('Failed to load: ' + err.message, 'error');
      }
    }

    // ---- Render table rows ----
    function renderRows(entries) {
      tbody.innerHTML = '';
      entries.forEach(entry => {
        const project  = projectMap[entry.projectId];
        const projName = project ? project.name : entry.projectId;
        const billable = project ? project.billable : null;

        const tr = document.createElement('tr');
        tr.dataset.id = entry.id;
        tr.innerHTML = `
          <td class="col-date">${esc(entry.date)}</td>
          <td class="col-project">${esc(projName)}</td>
          <td class="${billable === true ? 'billable-yes' : billable === false ? 'billable-no' : ''}">
            ${billable === true ? 'Yes' : billable === false ? 'No' : '<span class="muted">-</span>'}
          </td>
          <td class="col-hours">${entry.hours}</td>
          <td>${entry.taskId ? esc(entry.taskId) : '<span class="muted">-</span>'}</td>
          <td class="col-notes">${entry.description ? esc(entry.description) : '<span class="muted">-</span>'}</td>
          <td>
            <div class="actions">
              <button class="secondary outline btn-edit">Edit</button>
              <button class="contrast outline btn-del">Delete</button>
            </div>
          </td>`;
        tr.querySelector('.btn-edit').addEventListener('click', () => openEdit(entry.id));
        tr.querySelector('.btn-del').addEventListener('click',  () => deleteEntry(entry.id));
        tbody.appendChild(tr);
      });
    }

    function renderTotals(entries) {
      const total     = entries.reduce((s, e) => s + e.hours, 0);
      const billable  = entries.reduce((s, e) => {
        const p = projectMap[e.projectId];
        return s + (p && p.billable ? e.hours : 0);
      }, 0);
      const nonBill   = total - billable;

      tfoot.innerHTML = `
        <tr>
          <td colspan="3" style="text-align:right">Totals:</td>
          <td class="col-hours">${fmt(total)}</td>
          <td colspan="3">
            <span class="billable-yes">${fmt(billable)} billable</span>
            &nbsp;/&nbsp;
            <span class="billable-no">${fmt(nonBill)} non-billable</span>
          </td>
        </tr>`;
    }

    // ---- Edit modal ----
    function openEdit(id) {
      editId = id;
      const entry   = file.entries.find(e => e.id === id);
      const project = projectMap[entry.projectId];

      // Populate project dropdown with user's assigned projects
      const sel = document.getElementById('e-project');
      sel.innerHTML = myProjects.map(p =>
        `<option value="${esc(p.id)}"${p.id === entry.projectId ? ' selected' : ''}>${esc(p.name)}${p.billable ? '' : ' (non-billable)'}</option>`
      ).join('');

      document.getElementById('e-date').value  = entry.date;
      document.getElementById('e-hours').value = entry.hours;
      document.getElementById('e-desc').value  = entry.description || '';
      modalError.textContent = '';

      renderEditTaskField(entry.projectId, entry.taskId);

      sel.addEventListener('change', () => renderEditTaskField(sel.value, null), { once: false });
      sel._changeHandler && sel.removeEventListener('change', sel._changeHandler);
      sel._changeHandler = () => renderEditTaskField(sel.value, null);
      sel.addEventListener('change', sel._changeHandler);

      modal.showModal();
      document.getElementById('e-date').focus();
    }

    function renderEditTaskField(projectId, currentTaskId) {
      const project = projectMap[projectId];
      const wrap    = document.getElementById('e-task-wrap');

      if (!project || !project.requiresTaskId) {
        wrap.hidden = true;
        return;
      }
      wrap.hidden = false;

      const existing = document.getElementById('e-task');

      if (project.taskIds && project.taskIds.length) {
        if (existing.tagName !== 'SELECT') {
          const sel = document.createElement('select');
          sel.id = 'e-task';
          wrap.replaceChild(sel, existing);
        }
        const sel = document.getElementById('e-task');
        sel.innerHTML = '<option value="">Select task ID...</option>' +
          project.taskIds.map(t => `<option value="${esc(t)}"${t === currentTaskId ? ' selected' : ''}>${esc(t)}</option>`).join('');
      } else {
        if (existing.tagName !== 'INPUT') {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.id = 'e-task';
          inp.placeholder = 'Enter task ID';
          wrap.replaceChild(inp, existing);
        }
        document.getElementById('e-task').value = currentTaskId || '';
      }
    }

    document.getElementById('modal-cancel').addEventListener('click', () => modal.close());
    modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });

    document.getElementById('modal-save').addEventListener('click', async () => {
      modalError.textContent = '';

      const date      = document.getElementById('e-date').value;
      const projectId = document.getElementById('e-project').value;
      const hours     = parseFloat(document.getElementById('e-hours').value);
      const taskEl    = document.getElementById('e-task');
      const taskId    = (document.getElementById('e-task-wrap').hidden || !taskEl)
                          ? null
                          : taskEl.value.trim() || null;
      const desc      = document.getElementById('e-desc').value.trim() || null;
      const project   = projectMap[projectId];

      if (!date)        { modalError.textContent = 'Please enter a date.'; return; }
      if (!projectId)   { modalError.textContent = 'Please select a project.'; return; }
      if (isNaN(hours)) { modalError.textContent = 'Please enter valid hours.'; return; }
      if (project && project.requiresTaskId && !taskId) {
        modalError.textContent = 'Task ID is required for this project.';
        return;
      }

      const btn = document.getElementById('modal-save');
      btn.setAttribute('aria-busy', 'true');
      btn.disabled = true;

      try {
        const entryIndex = file.entries.findIndex(e => e.id === editId);
        if (entryIndex === -1) throw new Error('Entry not found.');

        // If the month changed, move the entry across files
        const oldPeriod = monthPicker.value;
        const newPeriod = date.slice(0, 7);

        if (newPeriod !== oldPeriod) {
          // Remove from current file
          file.entries.splice(entryIndex, 1);
          await dataWrite(`entries/${user.email}/${oldPeriod}.json`, file);

          // Add to target month file
          const targetPath = `entries/${user.email}/${newPeriod}.json`;
          let targetFile   = await dataRead(targetPath);
          if (!targetFile) targetFile = { consultant: user.email, period: newPeriod, entries: [] };
          targetFile.entries.push({ id: editId, date, projectId, hours, taskId, description: desc });
          await dataWrite(targetPath, targetFile);
        } else {
          file.entries[entryIndex] = { id: editId, date, projectId, hours, taskId, description: desc };
          await dataWrite(`entries/${user.email}/${oldPeriod}.json`, file);
        }

        modal.close();
        await loadEntries();
      } catch (err) {
        modalError.textContent = 'Failed to save: ' + err.message;
      } finally {
        btn.removeAttribute('aria-busy');
        btn.disabled = false;
      }
    });

    // ---- Delete ----
    async function deleteEntry(id) {
      const entry = file.entries.find(e => e.id === id);
      const project = projectMap[entry?.projectId];
      const label = project ? project.name : (entry?.projectId || id);
      if (!confirm(`Delete the entry for "${label}" on ${entry?.date}?`)) return;

      const period   = monthPicker.value;
      const blobPath = `entries/${user.email}/${period}.json`;

      setStatus('Deleting...', '');
      try {
        file.entries = file.entries.filter(e => e.id !== id);
        await dataWrite(blobPath, file);
        await loadEntries();
        setStatus('Entry deleted.', 'success');
        setTimeout(() => setStatus('', ''), 2000);
      } catch (err) {
        setStatus('Failed to delete: ' + err.message, 'error');
      }
    }

    // ---- Helpers ----
    function setStatus(msg, type) {
      status.textContent = msg;
      status.className   = type || '';
    }

    function currentMonthISO() {
      return new Date().toISOString().slice(0, 7);
    }

    function fmt(n) {
      return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    })();
  </script>
</body>
</html>
