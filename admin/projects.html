<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin: Projects - Time Reporting</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <style>
    .back-link { font-size: 0.9rem; margin-bottom: 1.5rem; display: block; }
    table { width: 100%; font-size: 0.9rem; }
    th { white-space: nowrap; }
    td { vertical-align: top; }
    .actions { display: flex; gap: 0.4rem; white-space: nowrap; }
    .actions button { font-size: 0.8rem; padding: 0.25rem 0.6rem; margin: 0; }
    .edit-row td { background: var(--pico-card-background-color, #f9f9f9); }
    .edit-row input, .edit-row select { margin-bottom: 0.3rem; font-size: 0.85rem; padding: 0.3rem 0.5rem; }
    .tag { display: inline-block; background: var(--pico-primary-background); color: var(--pico-primary); border-radius: 3px; padding: 0 0.4rem; font-size: 0.78rem; margin: 1px; }
    .billable-yes { color: green; font-weight: bold; }
    .billable-no  { color: var(--pico-muted-color); }
    .error { color: var(--pico-del-color, #c0392b); }
    .success { color: green; }
    #status { min-height: 1.2rem; font-size: 0.85rem; margin-bottom: 0.5rem; }
    .hint { font-size: 0.78rem; color: var(--pico-muted-color); margin-top: 0.1rem; }
  </style>
</head>
<body>
  <main class="container">
    <a href="../index.html" class="back-link">&larr; Back</a>
    <hgroup>
      <h1>Projects</h1>
      <p>Manage clients and project configuration</p>
    </hgroup>

    <div id="view-loading"><p aria-busy="true">Checking access...</p></div>
    <div id="view-denied" hidden><p class="error">Access denied - admin only.</p></div>

    <div id="view-main" hidden>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
        <p id="status"></p>
        <button id="btn-add" style="width:auto">+ Add project</button>
      </div>

      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Billable</th>
              <th>Task IDs required</th>
              <th>Predefined task IDs</th>
              <th>Allowed consultants</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="projects-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { handleRedirectAndGetAccount } from '../auth.js';
    import { adminRead, adminWrite, canWriteAdmin } from '../storage.js';

    (async () => {

    const viewLoading = document.getElementById('view-loading');
    const viewDenied  = document.getElementById('view-denied');
    const viewMain    = document.getElementById('view-main');
    const tbody       = document.getElementById('projects-tbody');
    const status      = document.getElementById('status');

    // ---- State ----
    let projects = [];

    // ---- Boot ----
    await handleRedirectAndGetAccount();
    viewLoading.hidden = true;

    const isAdmin = await canWriteAdmin();
    if (!isAdmin) { viewDenied.hidden = false; return; }

    viewMain.hidden = false;
    await loadProjects();

    document.getElementById('btn-add').addEventListener('click', () => addRow());

    // ---- Load ----
    async function loadProjects() {
      setStatus('Loading...');
      try {
        projects = await adminRead('projects.json');
        if (!Array.isArray(projects)) projects = [];
      } catch {
        projects = [];
      }
      renderTable();
      setStatus('');
    }

    // ---- Save ----
    async function saveProjects() {
      setStatus('Saving...');
      try {
        await adminWrite('projects.json', projects);
        setStatus('Saved.', 'success');
        setTimeout(() => setStatus(''), 2000);
      } catch (e) {
        setStatus('Save failed: ' + e.message, 'error');
      }
    }

    // ---- Render ----
    function renderTable() {
      tbody.innerHTML = '';
      if (!projects.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="color:var(--pico-muted-color)">No projects yet. Click "+ Add project" to create one.</td></tr>';
        return;
      }
      projects.forEach((p, i) => tbody.appendChild(makeViewRow(p, i)));
    }

    function makeViewRow(p, i) {
      const tr = document.createElement('tr');
      tr.dataset.index = i;
      tr.innerHTML = `
        <td><strong>${esc(p.name)}</strong><br><small style="color:var(--pico-muted-color)">${esc(p.id)}</small></td>
        <td class="${p.billable ? 'billable-yes' : 'billable-no'}">${p.billable ? 'Yes' : 'No'}</td>
        <td>${p.requiresTaskId ? 'Yes' : 'No'}</td>
        <td>${(p.taskIds || []).map(t => `<span class="tag">${esc(t)}</span>`).join(' ') || '<span style="color:var(--pico-muted-color)">-</span>'}</td>
        <td>${(p.allowedConsultants || []).map(c => `<span class="tag">${esc(c)}</span>`).join(' ') || '<span style="color:var(--pico-muted-color)">-</span>'}</td>
        <td class="actions">
          <button class="btn-edit secondary outline" data-i="${i}">Edit</button>
          <button class="btn-delete contrast outline" data-i="${i}">Delete</button>
        </td>`;
      tr.querySelector('.btn-edit').addEventListener('click', () => editRow(i));
      tr.querySelector('.btn-delete').addEventListener('click', () => deleteRow(i));
      return tr;
    }

    function makeEditRow(p, i, isNew = false) {
      const tr = document.createElement('tr');
      tr.className = 'edit-row';
      tr.innerHTML = `
        <td>
          <input id="ef-name" type="text" placeholder="Project name" value="${esc(p.name || '')}" required>
          <div class="hint">ID (auto-generated from name, not editable after creation): <code id="ef-id-preview">${esc(p.id || '')}</code></div>
        </td>
        <td>
          <select id="ef-billable">
            <option value="true"  ${p.billable ? 'selected' : ''}>Billable</option>
            <option value="false" ${!p.billable ? 'selected' : ''}>Non-billable</option>
          </select>
        </td>
        <td>
          <select id="ef-requires-task">
            <option value="false" ${!p.requiresTaskId ? 'selected' : ''}>No</option>
            <option value="true"  ${p.requiresTaskId ? 'selected' : ''}>Yes</option>
          </select>
        </td>
        <td>
          <input id="ef-task-ids" type="text" placeholder="DEV-001, MEET-001" value="${esc((p.taskIds || []).join(', '))}">
          <div class="hint">Comma-separated. Leave empty for free-text entry.</div>
        </td>
        <td>
          <input id="ef-consultants" type="text" placeholder="alice@co.com, bob@co.com" value="${esc((p.allowedConsultants || []).join(', '))}">
          <div class="hint">Comma-separated email addresses.</div>
        </td>
        <td class="actions">
          <button class="btn-save" data-i="${i}" data-new="${isNew}">Save</button>
          <button class="btn-cancel secondary outline" data-i="${i}" data-new="${isNew}">Cancel</button>
        </td>`;

      // Live ID preview when creating new
      if (isNew) {
        tr.querySelector('#ef-name').addEventListener('input', e => {
          tr.querySelector('#ef-id-preview').textContent = slugify(e.target.value);
        });
      }

      tr.querySelector('.btn-save').addEventListener('click', () => saveRow(tr, i, isNew));
      tr.querySelector('.btn-cancel').addEventListener('click', () => {
        if (isNew) tr.remove();
        else renderTable();
      });

      return tr;
    }

    // ---- Actions ----
    function editRow(i) {
      const tr = tbody.querySelector(`tr[data-index="${i}"]`);
      tr.replaceWith(makeEditRow(projects[i], i, false));
    }

    function addRow() {
      const blankProject = { id: '', name: '', billable: true, requiresTaskId: false, taskIds: [], allowedConsultants: [] };
      const tr = makeEditRow(blankProject, projects.length, true);
      tbody.appendChild(tr);
      tr.querySelector('#ef-name').focus();
    }

    async function saveRow(tr, i, isNew) {
      const name         = tr.querySelector('#ef-name').value.trim();
      const billable     = tr.querySelector('#ef-billable').value === 'true';
      const requiresTask = tr.querySelector('#ef-requires-task').value === 'true';
      const taskIds      = splitCSV(tr.querySelector('#ef-task-ids').value);
      const consultants  = splitCSV(tr.querySelector('#ef-consultants').value);

      if (!name) { alert('Project name is required.'); return; }

      const id = isNew ? slugify(name) : projects[i].id;

      if (isNew && projects.some(p => p.id === id)) {
        alert(`A project with ID "${id}" already exists. Choose a different name.`);
        return;
      }

      const updated = { id, name, billable, requiresTaskId: requiresTask, taskIds, allowedConsultants: consultants };

      if (isNew) projects.push(updated);
      else projects[i] = updated;

      await saveProjects();
      renderTable();
    }

    async function deleteRow(i) {
      const p = projects[i];
      if (!confirm(`Delete project "${p.name}"?\n\nThis does not delete existing time entries that reference it.`)) return;
      projects.splice(i, 1);
      await saveProjects();
      renderTable();
    }

    // ---- Helpers ----
    function setStatus(msg, type = '') {
      status.textContent = msg;
      status.className = type;
    }

    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function slugify(str) {
      return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function splitCSV(str) {
      return str.split(',').map(s => s.trim()).filter(Boolean);
    }

    })();
  </script>
</body>
</html>
